name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  server:
    name: server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      # The suites that need PostgreSQL are excluded here and run in their
      # own job below: service containers are Linux-only, and this matrix
      # includes Windows.
      - name: Test
        run: cargo test --bins --test release_consistency --test brand_assets
      - name: Build
        run: cargo build --release

  # The account rules live in the schema and in SQL -- constraints, cascades,
  # and the expression deciding whether a saved camera still means anything.
  # None of that can be checked without a database, and the first defect in it
  # was found by hand rather than by a test.
  database:
    name: database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lyrid
          POSTGRES_PASSWORD: lyrid
          POSTGRES_DB: lyrid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lyrid -d lyrid"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LYRID_TEST_DATABASE_URL: postgres://lyrid:lyrid@localhost:5432/lyrid
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--bins` as well: the binary's own tests include the queries checked
      # against Postgres -- the radio's tuning, the label cut, the listening
      # ledger -- which skip themselves without a database, and so until
      # v0.17 never ran in CI at all.
      - name: Test against a real database
        run: cargo test --bins --test accounts

  # rust-version is a promise to anyone building this. Without a job that
  # actually builds on it, the number silently rots the first time a newer API
  # is used — so read it from the manifest and hold the build to it.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from the manifest
        id: msrv
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Build on the declared MSRV
        run: cargo check --all-targets

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # The version web/package.json pins, read from there: the action looks
      # for packageManager at the repository root by default, and the Node
      # projects here live in subdirectories. One place for the version, so
      # the workflow cannot fall behind the lockfile.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  docs:
    name: docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/site/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm
          cache-dependency-path: docs/site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  # The one check a release tag waits for: every job above passed, or was
  # skipped on purpose. A tag held to the jobs themselves is held to their
  # names, and the first matrix that changes makes GitHub wait for a job that
  # no longer runs. `needs` alone would not do: a job whose dependency failed
  # is skipped, and a required check that was skipped counts as passed - so
  # this one runs always, and says.
  ci:
    name: ci
    if: always()
    needs:
      - server
      - database
      - msrv
      - web
      - docs
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<< "$NEEDS")"
          if [ -n "$failed" ]; then
            echo "$failed"
            exit 1
          fi
          echo "every job passed"
