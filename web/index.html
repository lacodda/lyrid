<!doctype html>
<!--
  `dark` is pinned, not followed. dowel's theme takes the reader's system
  preference, which is right for a tool and wrong here: the product is a night
  sky, and a light theme over it would be white panels on black space.
-->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 180px, cut from the full mark: a home-screen tile is not an icon in a
         list, and the filled hex that reads at 16px is a coloured blob here. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>lyrid — a music universe</title>
    <meta
      name="description"
      content="A canonical sky of 2.5 million artists, laid out by who is listened to alongside whom. Explore it by listening."
    />

    <!--
      What a link to lyrid unfurls into, in a chat or a timeline.

      A static picture rather than one rendered per star: the poster the app
      already draws is a client-side canvas capture, and an unfurl is fetched
      by a bot that runs no JavaScript. Per-star cards need the server to draw
      them, which is a tile renderer in the backend and a version of its own.
      A picture of the sky is honest about what is on the other side of the
      link, and it is one file.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="lyrid" />
    <meta property="og:title" content="lyrid — a music universe" />
    <meta
      property="og:description"
      content="A canonical sky of 2.5 million artists, laid out by who is listened to alongside whom. Explore it by listening."
    />
    <meta property="og:image" content="/social-preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
