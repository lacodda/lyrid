<!doctype html>
<meta charset="utf-8">
<title>lyrid sky renderer prototype</title>
<!--
  A standalone prototype, not part of the product.

  ADR 0003 requires the renderer to be validated on real-scale data before it
  is integrated, so that the frame budget is measured rather than promised.
  This page loads the real tile pyramid, draws every star as an instanced
  point sprite in one draw call, and reports frames per second while panning
  and zooming.

  Open it with `pnpm prototype` from web/.
-->
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #07080d; color: #cfd6e4; font: 13px/1.5 ui-monospace, monospace; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  #hud {
    position: fixed; top: 12px; left: 12px; padding: 10px 14px;
    background: rgba(10, 12, 20, 0.82); border: 1px solid #223; border-radius: 6px;
    white-space: pre; pointer-events: none; backdrop-filter: blur(6px);
  }
  #hud b { color: #4A8FE8; font-weight: 600; }
  #help { position: fixed; bottom: 12px; left: 12px; opacity: 0.55; }
</style>

<canvas id="sky"></canvas>
<div id="hud">loading tiles…</div>
<div id="help">drag to pan · wheel to zoom · 1-4 force a level · 0 auto</div>

<script type="module">
// ---------------------------------------------------------------- constants
// One record is 16 bytes: id (i32), x, y, brightness (f32). Matching the
// format documented in reference/tile-format.
const RECORD = 16;
const HEADER = 16;
// The pyramid is generated by `lyrid layout --tiles web/public/tiles`, from
// where the dev server serves it as ordinary static files -- which is exactly
// how it will be served in production.
const TILE_ROOT = '/tiles';

// ---------------------------------------------------------------- tile load
async function loadSky() {
  const meta = await (await fetch(`${TILE_ROOT}/sky.json`)).json();
  return meta;
}

/** Reads one tile into a flat Float32Array of (x, y, brightness) triples. */
async function loadTile(level, col, row) {
  const response = await fetch(`${TILE_ROOT}/${level}/${col}/${row}.bin`);
  if (!response.ok) return null;              // a missing tile means no stars
  const buffer = await response.arrayBuffer();

  // The status code proves nothing: a dev server answers a missing file with
  // 200 and an HTML fallback page, and a CDN may do the same. The magic is
  // what decides whether these bytes are a tile.
  if (buffer.byteLength < HEADER) return null;
  const view = new DataView(buffer);
  if (String.fromCharCode(...new Uint8Array(buffer, 0, 4)) !== 'LYST') return null;
  const count = view.getUint32(8, true);

  // Packed for the GPU: position and brightness interleaved, ids left behind
  // because the prototype never needs to identify a star.
  const packed = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const at = HEADER + i * RECORD;
    packed[i * 3 + 0] = view.getFloat32(at + 4, true);
    packed[i * 3 + 1] = view.getFloat32(at + 8, true);
    packed[i * 3 + 2] = view.getFloat32(at + 12, true);
  }
  return packed;
}

/** Every tile of one level, concatenated. */
async function loadLevel(level) {
  const side = 2 ** level;
  const parts = [];
  const requests = [];
  for (let col = 0; col < side; col++) {
    for (let row = 0; row < side; row++) {
      requests.push(loadTile(level, col, row).then(part => { if (part) parts.push(part); }));
    }
  }
  await Promise.all(requests);

  const total = parts.reduce((sum, part) => sum + part.length, 0);
  const packed = new Float32Array(total);
  let at = 0;
  for (const part of parts) { packed.set(part, at); at += part.length; }
  return packed;
}

// ---------------------------------------------------------------- rendering
const VERTEX = `#version 300 es
precision highp float;

// Per-instance: the star. There is no per-vertex data at all -- the quad is
// generated from gl_VertexID, which keeps the buffer to one attribute set.
in vec2 a_position;
in float a_brightness;

uniform vec2 u_camera;      // world coordinates at the centre of the screen
uniform float u_scale;      // pixels per world unit
uniform vec2 u_viewport;    // in pixels
uniform float u_time;

out float v_brightness;
out vec2 v_offset;

void main() {
  // A star's drawn size grows slowly with brightness and not at all with
  // zoom: stars are points of light, not discs, so they must not swell into
  // blobs when the camera comes closer.
  float size = mix(2.0, 7.0, a_brightness);

  // Twinkle: a per-star phase from its position, so neighbours do not pulse
  // in unison. Cheap enough to be free -- one sin per vertex.
  float phase = a_position.x * 0.7 + a_position.y * 1.3;
  size *= 0.9 + 0.1 * sin(u_time * 1.7 + phase);

  // The corner of this instance's quad, from the vertex index.
  vec2 corner = vec2(
    (gl_VertexID == 0 || gl_VertexID == 3 || gl_VertexID == 5) ? -1.0 : 1.0,
    (gl_VertexID < 2 || gl_VertexID == 5) ? -1.0 : 1.0
  );

  vec2 screen = (a_position - u_camera) * u_scale;
  vec2 pixel = screen + corner * size;
  gl_Position = vec4(pixel / (u_viewport * 0.5), 0.0, 1.0);

  v_brightness = a_brightness;
  v_offset = corner;
}`;

const FRAGMENT = `#version 300 es
precision highp float;

in float v_brightness;
in vec2 v_offset;
out vec4 fragment;

void main() {
  // A gaussian falloff rather than a hard disc: the glow is what makes a
  // field of points read as a sky instead of as a scatter plot.
  float distance = length(v_offset);
  float glow = exp(-4.0 * distance * distance);
  if (glow < 0.01) discard;

  // Brighter stars run warmer, faint ones stay blue -- the same azure the
  // product's mark uses, so the sky belongs to the brand without a palette.
  vec3 cold = vec3(0.29, 0.56, 0.91);
  vec3 warm = vec3(1.0, 0.94, 0.85);
  vec3 colour = mix(cold, warm, v_brightness * v_brightness);

  fragment = vec4(colour * glow, glow * (0.35 + 0.65 * v_brightness));
}`;

function compile(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(shader) ?? 'shader failed to compile');
  }
  return shader;
}

function createProgram(gl) {
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl, gl.VERTEX_SHADER, VERTEX));
  gl.attachShader(program, compile(gl, gl.FRAGMENT_SHADER, FRAGMENT));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(program) ?? 'program failed to link');
  }
  return program;
}

// ---------------------------------------------------------------------- run
const canvas = document.getElementById('sky');
const hud = document.getElementById('hud');
const gl = canvas.getContext('webgl2', { alpha: false, antialias: false });
if (!gl) { hud.textContent = 'WebGL2 is not available in this browser'; throw new Error('no webgl2'); }

const sky = await loadSky();
const levels = [];
for (let level = 0; level <= sky.max_level; level++) {
  levels.push(await loadLevel(level));
}

const program = createProgram(gl);
gl.useProgram(program);

const buffer = gl.createBuffer();
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
gl.bindBuffer(gl.ARRAY_BUFFER, buffer);

const positionLocation = gl.getAttribLocation(program, 'a_position');
const brightnessLocation = gl.getAttribLocation(program, 'a_brightness');
gl.enableVertexAttribArray(positionLocation);
gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 12, 0);
gl.vertexAttribDivisor(positionLocation, 1);
gl.enableVertexAttribArray(brightnessLocation);
gl.vertexAttribPointer(brightnessLocation, 1, gl.FLOAT, false, 12, 8);
gl.vertexAttribDivisor(brightnessLocation, 1);

const uniforms = {
  camera: gl.getUniformLocation(program, 'u_camera'),
  scale: gl.getUniformLocation(program, 'u_scale'),
  viewport: gl.getUniformLocation(program, 'u_viewport'),
  time: gl.getUniformLocation(program, 'u_time'),
};

// Additive blending, which is how light behaves: overlapping stars brighten
// rather than occlude. Depth testing is off -- everything is on one plane.
gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA, gl.ONE);

// ------------------------------------------------------------------- camera
const span = sky.max_x - sky.min_x;
const camera = { x: (sky.min_x + sky.max_x) / 2, y: (sky.min_y + sky.max_y) / 2, scale: 0 };
let forcedLevel = null;
let uploadedLevel = -1;

function resize() {
  // Clamped device pixel ratio, as ADR 0003 requires: fill rate is the main
  // risk for a glow-heavy scene, and a 3x retina buffer triples it for no
  // visible gain on points this small.
  const ratio = Math.min(window.devicePixelRatio || 1, 1.5);
  canvas.width = Math.floor(window.innerWidth * ratio);
  canvas.height = Math.floor(window.innerHeight * ratio);
  gl.viewport(0, 0, canvas.width, canvas.height);
  if (camera.scale === 0) camera.scale = canvas.width / span;
}
resize();
window.addEventListener('resize', resize);

/** Which level to draw: deeper as the camera zooms in. */
function levelFor() {
  if (forcedLevel !== null) return Math.min(forcedLevel, sky.max_level);
  const visibleSpan = canvas.width / camera.scale;
  const fraction = visibleSpan / span;              // 1 = whole sky in view
  const level = Math.round(Math.log2(1 / Math.max(fraction, 1e-6)));
  return Math.max(0, Math.min(level, sky.max_level));
}

// ----------------------------------------------------------------- controls
let dragging = false;
let last = { x: 0, y: 0 };

canvas.addEventListener('pointerdown', event => {
  dragging = true; last = { x: event.clientX, y: event.clientY };
  canvas.classList.add('dragging'); canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener('pointerup', event => {
  dragging = false; canvas.classList.remove('dragging'); canvas.releasePointerCapture(event.pointerId);
});
canvas.addEventListener('pointermove', event => {
  if (!dragging) return;
  const ratio = canvas.width / canvas.clientWidth;
  camera.x -= (event.clientX - last.x) * ratio / camera.scale;
  camera.y += (event.clientY - last.y) * ratio / camera.scale;
  last = { x: event.clientX, y: event.clientY };
});
canvas.addEventListener('wheel', event => {
  event.preventDefault();
  camera.scale *= Math.exp(-event.deltaY * 0.001);
  camera.scale = Math.max(canvas.width / span / 4, Math.min(camera.scale, 400));
}, { passive: false });
window.addEventListener('keydown', event => {
  if (event.key >= '1' && event.key <= '9') forcedLevel = Number(event.key) - 1;
  if (event.key === '0') forcedLevel = null;
});

// ---------------------------------------------------------------- benchmark
// ADR 0003 asks for the frame budget to be measured on real-scale data before
// the renderer is integrated. Opening the page with ?benchmark runs a fixed
// camera sweep over every level and reports the result, so the number comes
// from an identical run each time rather than from however the mouse moved.
const query = new URLSearchParams(location.search);
const benchmarking = query.has('benchmark');
const stressPasses = Math.max(1, Number(query.get('stress') ?? 1));
const benchmark = { level: 0, frames: [], started: 0, results: [] };
const BENCH_MS = 3000;

function benchmarkStep(now) {
  if (benchmark.started === 0) {
    benchmark.started = now;
    forcedLevel = benchmark.level;
    // A slow orbit, so the camera is always moving: a still frame measures
    // nothing a user would experience.
    camera.scale = canvas.width / span * (1.0 + benchmark.level * 0.6);
  }

  const elapsed = now - benchmark.started;
  const angle = elapsed * 0.0004;
  camera.x = (sky.min_x + sky.max_x) / 2 + Math.cos(angle) * span * 0.08;
  camera.y = (sky.min_y + sky.max_y) / 2 + Math.sin(angle) * span * 0.08;

  // The first 500 ms are warm-up: shader compilation and the first buffer
  // upload land there and would drag the average down unfairly.
  if (elapsed > 500) benchmark.frames.push(now);

  if (elapsed >= BENCH_MS) {
    const times = benchmark.frames;
    const seconds = (times[times.length - 1] - times[0]) / 1000;
    const fps = (times.length - 1) / seconds;
    const gaps = times.slice(1).map((t, i) => t - times[i]).sort((a, b) => a - b);
    benchmark.results.push({
      level: benchmark.level,
      stars: levels[benchmark.level].length / 3,
      fps: Number(fps.toFixed(1)),
      median_ms: Number(gaps[Math.floor(gaps.length / 2)].toFixed(2)),
      p95_ms: Number(gaps[Math.floor(gaps.length * 0.95)].toFixed(2)),
      worst_ms: Number(gaps[gaps.length - 1].toFixed(2)),
    });

    benchmark.level += 1;
    benchmark.frames = [];
    benchmark.started = 0;

    if (benchmark.level > sky.max_level) {
      const report = {
        stress_passes: stressPasses,
        device_pixel_ratio: Math.min(window.devicePixelRatio || 1, 1.5),
        viewport: [canvas.width, canvas.height],
        renderer: gl.getParameter(gl.getExtension('WEBGL_debug_renderer_info')?.UNMASKED_RENDERER_WEBGL ?? gl.RENDERER),
        levels: benchmark.results,
      };
      // Left where a script can read it, and shown for a human.
      globalThis.__lyridBenchmark = report;
      document.title = 'benchmark complete';
      // Posted back so a run can be captured without a human reading the
      // screen: the dev server logs it, and `?benchmark` becomes scriptable.
      fetch('/__benchmark', { method: 'POST', body: JSON.stringify(report) }).catch(() => {});
      hud.textContent = JSON.stringify(report, null, 2);
      const output = document.createElement('pre');
      output.id = 'benchmark-result';
      output.textContent = JSON.stringify(report);
      document.body.append(output);
      return false;
    }
  }
  return true;
}

// -------------------------------------------------------------------- frame
const frames = [];
let slowest = 0;

let benchmarkRunning = benchmarking;

function draw(now) {
  if (benchmarkRunning) benchmarkRunning = benchmarkStep(now);
  const level = levelFor();
  const stars = levels[level];

  if (level !== uploadedLevel) {
    gl.bufferData(gl.ARRAY_BUFFER, stars, gl.STATIC_DRAW);
    uploadedLevel = level;
  }

  gl.clearColor(0.027, 0.031, 0.051, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);

  gl.uniform2f(uniforms.camera, camera.x, camera.y);
  gl.uniform1f(uniforms.scale, camera.scale);
  gl.uniform2f(uniforms.viewport, canvas.width, canvas.height);
  gl.uniform1f(uniforms.time, now * 0.001);

  // Every visible star in one call, which is the whole point of instancing.
  //
  // ?stress=N draws the scene N times per frame. At 60 fps the frame time is
  // pinned to vsync and says only "fast enough", not how much room is left;
  // multiplying the work is the cheapest way to find the real ceiling.
  for (let pass = 0; pass < stressPasses; pass++) {
    gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, stars.length / 3);
  }

  // Frame timing over the last second, plus the worst frame seen -- an
  // average alone hides the stutter a user actually notices.
  frames.push(now);
  while (frames.length > 1 && now - frames[0] > 1000) frames.shift();
  const fps = frames.length > 1 ? (frames.length - 1) * 1000 / (now - frames[0]) : 0;
  if (frames.length > 30) {
    const worst = now - frames[frames.length - 2];
    slowest = Math.max(slowest * 0.995, worst);
  }

  hud.innerHTML =
    `<b>${fps.toFixed(0)} fps</b>   worst ${slowest.toFixed(1)} ms\n` +
    `level <b>${level}</b>${forcedLevel === null ? ' (auto)' : ' (forced)'}   ` +
    `stars <b>${(stars.length / 3).toLocaleString('en')}</b>\n` +
    `scale ${camera.scale.toFixed(3)} px/unit`;

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
