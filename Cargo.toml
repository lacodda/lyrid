[package]
name = "lyrid"
version = "0.12.1"
edition = "2024"
rust-version = "1.94"
description = "A music universe: a canonical sky of artists and genres you explore through real listening"
license = "MIT"
repository = "https://github.com/lacodda/lyrid"
homepage = "https://github.com/lacodda/lyrid"
readme = "README.md"
keywords = ["music", "discovery", "graph", "exploration"]
categories = ["multimedia"]
authors = ["Kirill Lakhtachev <lahtachev@gmail.com>"]
exclude = ["docs/", "web/", ".github/", "cliff.toml", "rustfmt.toml"]

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
bzip2 = "0.6.1"
clap = { version = "4.6.6", features = ["derive"] }
dotenvy = "0.15.7"
flate2 = "1.1"
# rustls with ring and the platform trust store, to match what sqlx already
# pulls in: a second crypto provider in one binary is two implementations of
# the same thing, and rustls refuses to guess which one to install.
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls", "smtp-transport", "builder", "ring", "rustls-platform-verifier"] }
quick-xml = "0.42"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "uuid", "time"] }
tar = "0.4.46"
# Direct, rather than through sqlx's re-export: the export formats timestamps
# as RFC 3339, and sqlx enables `time` without its formatting feature.
time = { version = "0.3.55", default-features = false, features = ["formatting"] }
tokio = { version = "1.53.1", features = ["full"] }
# Used directly for the ServiceBuilder that puts cache headers on the tiles;
# the tests use its ServiceExt too.
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["fs", "trace", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3.4"
uuid = { version = "1.26.0", features = ["serde"] }

[dev-dependencies]
# The integration suites read `.env` for their own database variable, so the
# local gate checks the same suites CI does. An integration test sees only
# dev-dependencies, which is why this is listed twice.
dotenvy = "0.15.7"
http-body-util = "0.1.5"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Line-table debug info keeps backtraces readable while cutting the .pdb weight
# that dominates target/debug. Full debug info is a one-line revert when needed.
[profile.dev]
debug = 1
