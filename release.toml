# How lyrid is released, read by furca's release engine: `furca release
# plan` says what the next release is and what stands in its way, `furca
# release run` carries it out - bump, changelog, gate, commit, push, green CI,
# tag, publish - and checks what went out. `lyrn check` reads it too.
# Reference: https://lacodda.github.io/furca/reference/release/

[project]
name = "lyrid"
changelog = "CHANGELOG.md"
# The server, the interface it serves and the documentation site carry one
# version: tests/release_consistency.rs holds them to each other.
manifests = [
    "Cargo.toml",
    "web/package.json",
    "docs/site/package.json",
]
# ADRs record what happened: the versions they name are history.
as_written = ["docs/adr/"]

[gate]
# Formatting only: it takes seconds and compiles nothing. The rest of the gate
# is CI, which the run waits for before the tag.
commands = [
    "cargo fmt --check",
]

[ci]
provider = "github"
workflow = "ci.yml"
publish = "release.yml"

# The files the tag's release page has to carry. Nothing goes to a registry:
# a release is the tag, its page and the stand.
[page]
assets = [
    "lyrid-{tag}-x86_64-pc-windows-msvc.zip",
    "lyrid-{tag}-x86_64-unknown-linux-gnu.tar.gz",
    "lyrid-{tag}-aarch64-unknown-linux-gnu.tar.gz",
]

# The service goes out to its stand: turnout deploys it from here and checks
# the stand's health. Which stand is turnout's own configuration, not this
# file's.
[post.deploy]
