# The deployed stand: the server, its database, and nothing else listening.
#
# Unlike development, this process serves the SPA and the tiles itself, so
# there is no proxy in front and no second origin. Credentials come from .env,
# which is never committed and never baked into the image.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lyrid}
    # Deliberately no published port: the database is reachable only from the
    # compose network, so the stand exposes one service, not two.
    volumes:
      # postgres:18+ keeps data in a version-specific subdirectory; the mount
      # must sit one level up or the entrypoint refuses to start.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-lyrid}"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lyrid}
      RUST_LOG: ${RUST_LOG:-lyrid=info,tower_http=info}
      # How this stand is reached from outside. It cannot be inferred: the
      # server binds 0.0.0.0 inside a container and is reached by a host name
      # on a different port. The links in letters and the preview image a
      # shared link unfurls into are both built from this.
      LYRID_PUBLIC_URL: ${LYRID_PUBLIC_URL:-http://pi:8083}
      # Unset on the home stand, which has no route to the internet: the two
      # letters go to `docker compose logs server` instead of being sent, link
      # and all. A supported configuration, not a fallback -- and the reason
      # the stand's log is not something to share.
      LYRID_SMTP_URL: ${LYRID_SMTP_URL:-}
      LYRID_MAIL_FROM: ${LYRID_MAIL_FROM:-lyrid <no-reply@pi>}
    ports:
      - "${LYRID_PORT:-8083}:8080"
    volumes:
      # The tile pyramid is data, not part of the image: it is regenerated by
      # `lyrid layout` on the stand and would otherwise force a rebuild.
      - tiles:/app/static/tiles

volumes:
  db-data:
  tiles:
